<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de uma Turma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Turma</h1>
    </header>
    <section>
        <div>
            <p>Informe nome do aluno: <input type="text" name="nome" id="nome"></p>
            <p>Informe a Primeira Nota: <input type="number" name="nota1" id="nota1"></p>
            <p>Informe a Segunda Nota: <input type="number" name="nota2" id="nota2"></p>
            <button onclick="adicionar()">Adicionar</button>
            <button onclick="finalizar()">Finalizar</button>
            <button onclick="remover()">Remover</button>
        </div>
        <div>
            <table id="tabelaAlunos">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Notas</th>
                        <th>Média</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <!-- alunos vão aparecer aqui -->
                </tbody>
            </table>
        </div>
    </section>
    <script src="logic.js"></script>
</body>
</html>
