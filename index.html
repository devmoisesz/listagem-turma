<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Turma: Aprovados e Reprovados</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Listagem de Turma: Aprovados e Reprovados</h1>
    </header>
    <section>
            <h3>Informe a média de cada bimestre do aluno</h3>
        <div class="campo">
            <label for="">Nome do aluno:</label>
            <input type="text" name="nome" id="nome">
        </div>
        
        <div class="campo">
            <label for="bim1">Primeiro Bimestre:</label> 
            <input type="number" name="bim1" id="bim1" min="0" max="10">
        </div>

        <div class="campo">
            <label for="bim2">Segundo Bimestre:</label>
            <input type="number" name="bim2" id="bim2" min="0" max="10">
        </div>

        <div class="campo"> 
            <label for="bim3">Terceiro Bimestre:</label>
            <input type="number" name="bim3" id="bim3" min="0" max="10">
        </div>

        <div class="campo"> 
            <label for="bim4">Quarto Bimestre:</label>
            <input type="number" name="bim4" id="bim4" min="0" max="10">
        </div>
            <button onclick="adicionar()">Adicionar</button>
            <button onclick="resultado()">Resultado</button>
            <button onclick="limpar()">Limpar</button>
        </div>
        <div>
            <table id="tabelaAlunos">
                <thead>
                    <tr>
                        <th>Nome:</th>
                        <th>1° Bimestre</th>
                        <th>2° Bimestre</th>
                        <th>3° Bimestre</th>
                        <th>4° Bimestre</th>
                        <th>Média:</th>
                        <th>Status:</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <!-- alunos vão aparecer aqui -->
                </tbody>
            </table>
        </div>
        <div id="resultado">
            
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
